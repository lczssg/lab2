# A four-switch branching tree: one data model builds and documents this network.
# The links form a tree, so Linux bridges have no forwarding loop.
student_id_last4: "6101"

switches:
  - s1
  - s2
  - s3
  - s4

hosts:
  - name: h1
    ip: 10.1.0.1/24
    ipv6: fd00:6101::1/64
  - name: h2
    ip: 10.1.0.2/24
    ipv6: fd00:6101::2/64
  - name: h3
    ip: 10.1.0.3/24
    ipv6: fd00:6101::3/64
  - name: h4
    ip: 10.1.0.4/24
    ipv6: fd00:6101::4/64
  - name: h5
    ip: 10.1.0.5/24
    ipv6: fd00:6101::5/64
  - name: h6
    ip: 10.1.0.6/24
    ipv6: fd00:6101::6/64

# h1 is local to s1, h2/h3 share s2, h4/h5 share s3, and h6 is behind s4.
links:
  - [h1, s1]
  - [h2, s2]
  - [h3, s2]
  - [h4, s3]
  - [h5, s3]
  - [h6, s4]
  - [s1, s2]
  - [s1, s3]
  - [s3, s4]

